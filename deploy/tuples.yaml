# Static authorization tuples for LoadStaticAuthorizer (dev / CI; the
# OpenFGA-backed implementation is a later, build-tagged task). This checker
# does not resolve any graph — every relation must be written in its
# already-resolved form, not derived from another one (e.g. a customer's
# segment membership does not by itself grant that customer's employees
# `handled_by`; write `handled_by` directly).
#
# Exactly three relations, named after Authorizer's three methods. Absence
# of a tuple here is a denial, never an error: an unlisted principal, agent,
# employee, customer or segment simply answers false.
#
# Identity convention: every principal/agent/employee/customer string below
# is TYPE-PREFIXED ("customer:C", "employee:jdoe", "agent:order-assistant"),
# matching the subject forms the minted tokens carry — see the Authorizer
# doc comment in sts/authz.go. Segment names are the one exception: they are
# policy labels, not identities, so they stay bare.

# CanInvoke(principal, agent): may this identity reach this agent at all?
# Both entries are needed, and for different reasons: the customer's own
# entitlement covers the direct path, and the employee's covers the
# delegating one — exchange.go asks can_invoke TWICE when an employee acts
# for a customer (spec §3.3), once for each, and either miss denies.
can_invoke:
  - principal: customer:C
    agent: agent:order-assistant
  - principal: employee:jdoe
    agent: agent:order-assistant

# HandledBy(employee, customer): is this employee the one assigned to this
# customer? Asked only when an employee acts on a customer's behalf — the
# line between helping a customer and impersonating one.
handled_by:
  - employee: employee:jdoe
    customer: customer:C

# InSegment(principal, segment): does this principal belong to this
# segment? Segment names here should match deploy/claims.yaml's `segments:`
# keys — those are the only segments the claims policy knows how to turn
# into authority.
in_segment:
  - principal: customer:C
    segment: retail-vip
  # The employee's own segment. Required, not decorative: when delegating,
  # the employee's claim is resolved from their own segments as well as the
  # customer's, and an employee in no segment resolves to no roles and is
  # denied — so without this the handled_by tuple above could never be
  # exercised by anything.
  - principal: employee:jdoe
    segment: support-staff
