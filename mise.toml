# Toolchain and tasks for sts. `mise install` gets you a working checkout;
# `mise run ci` is exactly what CI runs.
#
# Task names match the other garm-ai repositories on purpose: `mise run test`
# means the same thing everywhere, so moving between repositories costs no
# relearning.

[tools]
go = "1.26"

[tasks.build]
description = "Build every package, both build tag sets"
# Twice, because a build tag hides a whole file from the compiler. Exactly
# one of cmd/sts/authz_static.go and cmd/sts/authz_openfga.go is compiled
# into any given binary, so an untagged build proves nothing about the
# tagged one — the production binary is the tagged one.
run = ["go build ./...", "go build -tags openfga ./..."]

[tasks.test]
description = "Run the tests"
# -timeout because Go's default is ten minutes, and a test waiting on a
# service that never answers will sit there for all of it. A CI job that
# hangs before failing is one nobody waits for.
#
# Untagged only: -tags openfga additionally compiles
# authz_openfga_parity_test.go, which deliberately FAILS rather than skips
# when no -openfga-url is given (a parity run with no store to check against
# must not report ok). Running it here needs a live OpenFGA server; the vet
# task below still type-checks it under both tag sets.
run = "go test ./... -race -count=1 -timeout 120s"

[tasks.lint]
description = "Vet the Go, both build tag sets"
run = ["go vet ./...", "go vet -tags openfga ./..."]

[tasks.fmt]
description = "Format"
run = "go fmt ./..."

[tasks."fmt-check"]
description = "Fail if anything is unformatted"
# Part of CI because `go vet` does not check formatting.
run = """
out=$(gofmt -l .)
if [ -n "$out" ]; then
  echo "unformatted — run 'mise run fmt':" >&2
  echo "$out" >&2
  exit 1
fi
"""

[tasks.cli]
description = "Install the garm CLI at the pinned version"
# Pinned, not @latest, for the same reason examples pins it: the vocabulary
# a claims policy is checked against must not shift because someone upgraded
# a CLI on a laptop. The CLI is a BINARY here, installed rather than
# imported — and since the split it is all github.com/garm-ai/garm still is.
# The module dependency approve.go takes is on
# github.com/garm-ai/contracts/grant, a separate module, which exists so the
# digest a grant carries and the digest garmd recomputes are one function and
# not two implementations (approval-grants design, "Decided" item 4). The two
# versions move independently: bumping this pin cannot change the digest, and
# bumping the contract cannot change the vocabulary checked below.
#
# v0.14.2: the first tag whose `claims check` and `catalogue build` read the
# bank example as it is laid out today (agent manifests, material fields).
# Pinned, not latest, so a garm release cannot turn this repository's CI red
# on its own; bump it deliberately when the bank example moves.
# IT MUST MOVE WITH examples, because that tree is what claims-check builds.
# v0.23.0-rc.1 was the pin examples itself used: v0.20.0 is the release that
# reads `catalogue.yaml` at all, and the bank's sixth agent declares
# MODE_WORKFLOW, whose fields arrive in contracts v0.6.0-rc.1 — the version
# this CLI links. An older CLI composes the catalogue from a descriptor set
# that has no such fields, SILENTLY.
#
# Raised again, from the release candidate to v0.29.0, because "it must move
# with examples" was true and had stopped being honoured: examples moved on
# to v0.29.0 (which deletes --proto) while this pin sat six minor releases
# behind, on a CLI that predates lint rules A12-A15 — a consent template the
# bank gains later would lint clean here and nowhere else, which is a rule
# skipped where nobody is looking.
run = "go install github.com/garm-ai/garm/cmd/garm@v0.29.0"

[tasks."claims-check"]
description = "Assert deploy/claims.yaml only references what the bank catalogue declares"
depends = ["cli"]
# sts owns no catalogue of its own. deploy/claims.yaml is checked against
# bank's, from garm-ai/examples (public) — EXAMPLES_DIR points at a checkout
# of it. CI checks one out fresh on every run; locally it defaults to a
# sibling checkout, which is how these repositories are conventionally
# cloned.
#
# The catalogue is BUILT here, from that checkout's proto, every run — never
# read from a bank.binpb on disk. That artifact is gitignored and generated
# in examples, so a copy lying around anywhere is only ever a stale guess at
# the real vocabulary.
run = """
set -e
EXAMPLES_DIR="${EXAMPLES_DIR:-../examples}"
WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT
# examples composes its catalogue from catalogue.yaml: the bank's proto tree
# takes garm/meta/v1/meta.proto and the rest from the contracts MODULE rather
# than vendoring them, so a single directory cannot resolve its own imports —
# `--proto` could not build this tree even before garm deleted it. Building
# via the manifest is also the only way the module versions resolve to that
# tree's go.mod.
(cd "$EXAMPLES_DIR" && garm catalogue build -o "$WORK/bank.binpb")
garm claims check deploy/claims.yaml --against "$WORK/bank.binpb"
"""

[tasks.ci]
description = "Everything CI runs"
depends = ["fmt-check", "lint", "build", "test", "claims-check"]
